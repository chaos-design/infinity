name: Publish Release

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write # Required to create a GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # On workflow_dispatch GITHUB_REF_NAME is the selected branch, not the tag.
          tag="${INPUT_TAG:-$REF_NAME}"
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Tag Matches package.json
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG must look like v1.2.3"
            exit 1
          fi
          tag_version="${TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag $TAG does not match package.json version $package_version"
            exit 1
          fi

      # Single source of truth for the pnpm version is packageManager in package.json.
      # Never run `corepack prepare pnpm@latest`: a newer major writes a different
      # lockfileVersion and --frozen-lockfile would fail or silently drift.
      - name: Enable pnpm
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Extension ZIPs
        run: |
          pnpm exec wxt zip
          pnpm exec wxt zip -b firefox
          pnpm exec wxt zip -b edge

      - name: Verify Release Assets
        run: |
          missing=0
          for browser in chrome firefox edge; do
            if ! ls .output/*-"$browser".zip >/dev/null 2>&1; then
              echo "::error::Missing .output/*-$browser.zip"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Infinity ${{ steps.tag.outputs.name }}
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
            .output/*-edge.zip
          generate_release_notes: true # Automatically generates changelog from commits
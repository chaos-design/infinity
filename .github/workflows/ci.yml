name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch makes the previous run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Must come after setup-node: corepack writes its pnpm shim into the
      # active Node's bin directory, so enabling it first means the shim is
      # left behind once setup-node switches Node versions. Ordering here also
      # rules out setup-node's `cache: pnpm`, which runs `pnpm store path`
      # before pnpm exists.
      - name: Enable pnpm
        run: corepack enable

      # Same pnpm version source as the release workflow: packageManager in package.json.
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm compile

      - name: Test
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build